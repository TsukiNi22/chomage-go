overrides:
  # rolldown 1.2.8 (tire par vitest) a ete publie le 2026-09-09 et tombe sous la
  # regle minimumReleaseAge : l'installation en conteneur la refuse. On epingle
  # la version precedente, deja hors fenetre, plutot que d'exclure 16 paquets
  # de la verification supply-chain.
  rolldown: 1.2.7

allowBuilds:
  '@scarf/scarf': false
  esbuild: false
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - lucide-react@1.39.0

packages:
  - "apps/*"
  - "packages/*"
