name: CD - Build

on:
  push:
    branches: [main]

jobs:
  mirror:
    if: github.repository != 'TsukiNi22/chomage-go'

    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
